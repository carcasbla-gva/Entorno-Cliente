<!doctype html>
<html lang="es">

<head>
    <script src="App.js"></script>
    <meta charset="UTF-8" />
    <title>Ejercicio 1 - Formulario</title>
</head>

<body>
    <h2>FORMULARIO</h2>

    <form id="miFormulario">
        <p>
            <label for="nombre">Nombre:</label><br />
            <input type="text" id="nombre" name="nombre" />
        </p>

        <p>
            <label for="apellidos">Apellidos:</label><br />
            <input type="text" id="apellidos" name="apellidos" />
        </p>

        <p>
            <label for="telefono">Teléfono:</label><br />
            <input type="text" id="telefono" name="telefono" />
        </p>

        <p>
            <label for="dni">DNI:</label><br />
            <input type="text" id="dni" name="dni" />
        </p>

        <p>
            <label for="edad">Edad:</label><br />
            <input type="number" id="edad" name="edad" />
        </p>

        <p>
            Sexo:<br />
            <input type="radio" id="hombre" name="sexo" value="Hombre" checked />
            <label for="hombre">Hombre</label><br />
            <input type="radio" id="mujer" name="sexo" value="Mujer" />
            <label for="mujer">Mujer</label>
        </p>

        <p>
            <label for="foto">Incluir mi foto:</label><br />
            <input type="file" id="foto" name="foto" />
        </p>

        <p>
            <input type="checkbox" id="publicidad" name="publicidad" checked />
            <label for="publicidad">Enviar publicidad</label>
        </p>

        <p>
            <label for="aficion">Elige tu afición favorita:</label>
            <select id="aficion" name="aficion">
                <option value="musica">musica</option>
                <option value="lectura">lectura</option>
                <option value="deporte">deporte</option>
            </select>
        </p>

        <p>
            <label for="observaciones">Observaciones:</label><br />
            <textarea id="observaciones" name="observaciones" rows="4" cols="40"></textarea>
        </p>

        <p>
            <input type="submit" value="Guardar cambios" />
            <input type="reset" value="Borrar los datos introducidos" />
        </p>
    </form>

    <!-- <script src="App.js"></script> -->
</body>

</html>
