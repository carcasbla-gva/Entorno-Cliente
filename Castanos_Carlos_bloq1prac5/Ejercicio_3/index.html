<!DOCTYPE html>
<html lang="es">
<head>
    <script src="App.js"></script>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Color Radio</title>
</head>
<body>
    <p id="parrafoTexto">Este párrafo cambiará de color con la opción seleccionada del cuadro de lista</p>

    <p>
        <input type="radio" id="verde" name="colorRadio" value="green">
        <label for="verde">Verde</label><br>

        <input type="radio" id="azul" name="colorRadio" value="blue">
        <label for="azul">Azul</label><br>

        <input type="radio" id="rojo" name="colorRadio" value="red">
        <label for="rojo">Rojo</label>
    </p>

</body>
</html>
